name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The pipeline must run on Windows too (paths, entry-point checks).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Tests don't need a browser; skip Playwright's browser download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build an offline demo city
        run: npm run build:world -- melbourne --synthetic --preview
      - name: Check the city was written
        shell: bash
        run: test -f public/cities/melbourne/manifest.json && test -f public/cities/index.json
      - run: npx vite build
